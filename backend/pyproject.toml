[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - A simple, universal swarm-intelligence engine that predicts anything"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # LLM
    "openai>=1.0.0",

    # Self-hosted temporal knowledge graph (replaces Zep Cloud).
    # neo4j driver version is pinned by camel-oasis (==5.23.0); the Bolt protocol
    # is backwards-compatible so we still run Neo4j 5.26+ on the server side.
    "graphiti-core>=0.29.0",
    "neo4j>=5.23",

    # OASIS social-media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",

    # File handling
    "PyMuPDF>=1.24.0",
    # Encoding detection (supports non-UTF-8 text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # Report export (Markdown -> HTML -> PDF)
    "markdown>=3.6",
    "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# camel-oasis pins neo4j==5.23.0; graphiti-core requires >=5.26.
# Override to graphiti-core's range — the Python driver is API-stable across
# this gap and we still run Neo4j 5.26 server-side via docker compose.
[tool.uv]
override-dependencies = [
    "neo4j>=5.23,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
