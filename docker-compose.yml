services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mirofish-neo4j
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [mirofish]

  mirofish:
    build: .
    container_name: mirofish
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads
      # Dev-bind: live-edit backend code without rebuilding the image during the migration PoC.
      - ./backend/app:/app/backend/app
    networks: [mirofish]

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  mirofish:
    driver: bridge
